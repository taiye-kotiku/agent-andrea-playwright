[phases.setup]
aptPkgs = ["curl"]

[phases.install]
cmds = [
    "curl -L -o /usr/local/bin/lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux && chmod +x /usr/local/bin/lightpanda"
]

[start]
cmd = "lightpanda serve --host 0.0.0.0 --port 9222 & sleep 3 && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
