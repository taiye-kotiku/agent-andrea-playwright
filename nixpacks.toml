[phases.setup]
aptPkgs = [
    "libgtk-3-0", "libgdk-pixbuf2.0-0", "libnotify4", "libdrm2", "libxkbcommon0",
    "libgbm1", "libnss3", "libnspr4", "libasound2", "libxshmfence1",
    "libatk-bridge2.0-0", "libcups2", "libxdamage1", "libxfixes3", "libxrandr2",
    "libatspi2.0-0", "libxcursor1", "libxi6", "libxtst6", "libpango-1.0-0",
    "libcairo2", "libegl1", "libwayland-egl1"
]

[phases.install]
cmds = [
    "pip install --no-cache-dir -r requirements.txt",
    "python3 -m playwright install chromium"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
